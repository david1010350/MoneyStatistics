<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>試算表多欄資料顯示ㄉˇ123</title>
  <style>
    body {
      font-family: "Noto Sans TC", sans-serif;
      background: #f7f7f7;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 25px;
    }
    table {
      width: 95%;
      max-width: 800px;
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }
    thead {
      background: #4CAF50;
      color: white;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    tr:hover {
      background: #f1f1f1;
    }
  </style>
</head>
<body>
  <h1>Google 試算表資料顯示</h1>
  <table id="dataTable">
    <thead></thead>
    <tbody></tbody>
  </table>

  <script>
    // ✅ 你的試算表 CSV 連結
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQXjirhbiRpy2fKDCpc099YQjLMpp0fUAUnxLi0qZp2XF_iXRGghrTlTNQC07jDKNqK-GC6yJepWQrI/pub?output=csv';

    fetch(sheetUrl)
      .then(res => res.text())
      .then(csv => {
        const lines = csv.trim().split('\n').map(line => line.split(','));
        const table = document.getElementById('dataTable');
        const thead = table.querySelector('thead');
        const tbody = table.querySelector('tbody');

        // 第一列當作標題列
        const headers = lines[0];
        const headerRow = document.createElement('tr');
        headers.forEach(header => {
          const th = document.createElement('th');
          th.textContent = header.trim();
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        // 其他列為資料列
        lines.slice(1).forEach(row => {
          const tr = document.createElement('tr');
          row.forEach(cell => {
            const td = document.createElement('td');
            td.textContent = cell.trim();
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      })
      .catch(err => {
        console.error('讀取試算表資料發生錯誤：', err);
      });
  </script>
</body>
</html>
