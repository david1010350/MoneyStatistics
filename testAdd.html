<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>留言到試算表</title>
  <style>
    body { font-family: "Noto Sans TC", sans-serif; padding: 30px; text-align: center; }
    input, button { padding: 10px; font-size: 16px; margin: 5px; }
    input { width: 300px; }
    button { cursor: pointer; }
    #result { margin-top: 15px; color: #333; font-weight: bold; }
  </style>
</head>
<body>
  <h1>新增留言至試算表</h1>
  <input type="text" id="textInput" placeholder="ㄊ請輸入文字..." />
  <button id="submitBtn">送出</button>
  <p id="result"></p>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbxR5jAY3AuV-tL83Qis2dCCfhnNoPVbGhCzlVf0AY_zgNoJbByt5DgtlQm6dP4zfWCa/exec"; // ←換成你的 /exec URL

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const text = document.getElementById("textInput").value.trim();
      const resultEl = document.getElementById("result");

      if (!text) {
        resultEl.textContent = "❌ 請先輸入文字";
        return;
      }

      try {
        const response = await fetch(scriptURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        resultEl.textContent = data.message;
        document.getElementById("textInput").value = ""; // 清空輸入框
      } catch (err) {
        resultEl.textContent = "⚠️ 發生錯誤：" + err.message;
      }
    });
  </script>
</body>
</html>
