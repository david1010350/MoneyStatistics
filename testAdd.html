<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>留言上傳到試算表</title>
</head>
<body>
  <h2>新增留言</h2>
  <input type="text" id="textInput" placeholder="輸入文字..." />
  <button id="submitBtn">送出</button>

  <p id="result"></p>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwpBFDazAkn1lY9J4UEo1nJ5T0Ju_SPN19yOF_TT-Da3jp8BSS5Xg1mlL6hD8ep-LAp/exec"; // ←改成你的網址

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const text = document.getElementById("textInput").value.trim();
      if (!text) {
        document.getElementById("result").innerText = "請輸入內容";
        return;
      }

      try {
        const response = await fetch(scriptURL, {
          method: "POST",
          body: JSON.stringify({ text }),
          headers: { "Content-Type": "application/json" },
        });

        console.log("fetch response:", response); // debug
  const data = await response.json();
  document.getElementById("result").innerText = data.message;
} catch (error) {
  console.error("fetch error:", error);
  document.getElementById("result").innerText = "⚠️ 發生錯誤：" + error.message;
}
    });
  </script>
</body>
</html>
