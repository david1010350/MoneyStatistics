<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>留言上傳到試算表</title>
</head>
<body>
  <h2>新增留言</h2>
  <input type="text" id="textInput" placeholder="輸入文字..." />
  <button id="submitBtn">送出</button>

  <p id="result"></p>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbyp7XDUD5Sj7HXmwibWsAgydX7wekJV4ChcSvgldFfu_zdJJ_wojoUAKdWOUwZzqkc/exec"; // ←改成你的網址

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const text = document.getElementById("textInput").value.trim();
      if (!text) {
        document.getElementById("result").innerText = "請輸入內容";
        return;
      }

      try {
        const response = await fetch(scriptURL, {
          method: "POST",
          body: JSON.stringify({ text }),
          headers: { "Content-Type": "application/json" },
        });

        const data = await response.json();
        document.getElementById("result").innerText = data.message;
      } catch (error) {
        document.getElementById("result").innerText = "⚠️ 發生錯誤：" + error.message;
      }
    });
  </script>
</body>
</html>
