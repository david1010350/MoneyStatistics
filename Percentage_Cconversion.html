<div style="
    margin: 10pt;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
">

    <span>百分比：</span>

    <input
        type="text"
        id="percentage"
        placeholder="例如 0.5"
        style="
            width: 90px;
            padding: 8px 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: 0.2s;
        "
        onfocus="this.style.border='2px solid #0071e3'; this.style.boxShadow='0 0 0 3px rgba(0,113,227,0.15)'"
        onblur="this.style.border='1px solid #d2d2d7'; this.style.boxShadow='none'"
    >

    <button
        onclick="convertPercentage()"
        style="
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #0071e3;
            color: white;
            font-size: 15px;
            cursor: pointer;
        "
    >
        轉換
    </button>

    <span>轉換值：</span>

    <input
        type="text"
        id="result"
        readonly
        style="
            width: 90px;
            padding: 8px 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            background: #f5f5f7;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        "
    >

</div>

<script>
function convertPercentage() {
    const percentage = document.getElementById("percentage").value;

    if (percentage === "") {
        document.getElementById("result").value = "";
        return;
    }

    document.getElementById("result").value = Number(percentage) / 100;
}
</script>
