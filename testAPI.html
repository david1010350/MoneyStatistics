<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Softr 用戶建立</title>
<style>
body { font-family: sans-serif; padding: 20px; }
input { display: block; margin: 8px 0; width: 240px; padding: 4px; }
button { padding: 6px 12px; cursor: pointer; }
pre { background: #f5f5f5; padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h2>建立 Softr 用戶</h2>
  <input id="full_name" placeholder="姓名">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="密碼">
  <button onclick="sendData()">送出</button>

  <h3>結果：</h3>
  <pre id="result"></pre>

  <script>
  function sendData() {
    // 使用 window.external 傳資料給 VB.NET
    const user = {
      full_name: document.getElementById('full_name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      generate_magic_link: true
    };
    // 呼叫 VB.NET 端的方法
    window.external.ReceiveData(JSON.stringify(user));
  }

  // VB.NET 會呼叫這個方法更新結果
  function showResult(text) {
    document.getElementById('result').textContent = text;
  }
  </script>
</body>
</html>
