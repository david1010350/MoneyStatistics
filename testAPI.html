<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Softr 註冊範例</title>
</head>
<body>
  <h2>Softr 註冊表單</h2>

  <label>姓名：</label>
  <input type="text" id="full_name" placeholder="輸入姓名"><br><br>

  <label>Email：</label>
  <input type="email" id="email" placeholder="輸入信箱"><br><br>

  <label>密碼：</label>
  <input type="password" id="password" placeholder="輸入密碼"><br><br>

  <button id="registerBtn">註冊 Softr 帳號</button>

  <pre id="result" style="margin-top:20px; background:#eee; padding:10px;"></pre>

  <script>
    document.getElementById("registerBtn").addEventListener("click", async () => {
      const full_name = document.getElementById("full_name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const bodyData = {
        full_name,
        email,
        password,
        generate_magic_link: true
      };

      try {
        const response = await fetch("https://studio-api.softr.io/v1/api/users", {
          method: "POST",
          headers: {
            "Softr-Api-Key": "oPTP9jZlJwpT2R4hZZY07MYIg",
            "Softr-Domain": "moneystatisticsconsole.softr.app",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(bodyData)
        });

        const result = await response.json();
        document.getElementById("result").innerText = JSON.stringify(result, null, 2);
      } catch (error) {
        document.getElementById("result").innerText = "錯誤：" + error;
      }
    });
  </script>
</body>
</html>
